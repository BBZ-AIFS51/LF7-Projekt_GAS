<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Montage: Bedienteil außen, Sensorteil innen, zur Tür gedreht (Draufsicht)</title>
  <defs>
    <!-- the PIR cannot see through the wall: cut the cone at the outer wall face -->
    <clipPath id="room">
      <rect x="0" y="190" width="720" height="450"/>
    </clipPath>
  </defs>
  <rect width="720" height="640" fill="#ffffff"/>

  <!-- room labels -->
  <text x="620" y="60" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">FLUR (außen)</text>
  <text x="620" y="615" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">RAUM (innen)</text>

  <!-- wall with door opening -->
  <rect x="0" y="190" width="300" height="36" fill="#cbd5e1" stroke="#64748b"/>
  <rect x="520" y="190" width="200" height="36" fill="#cbd5e1" stroke="#64748b"/>
  <text x="60" y="213" fill="#334155">Wand</text>
  <!-- door frame -->
  <rect x="292" y="186" width="12" height="44" fill="#a16207"/>
  <rect x="512" y="186" width="12" height="44" fill="#a16207"/>
  <!-- door leaf (closed) and swing, hinge on the right = away from the sensor -->
  <rect x="304" y="222" width="208" height="8" fill="#d97706"/>
  <path d="M 304 230 A 208 208 0 0 0 512 438" fill="none" stroke="#d97706" stroke-dasharray="4 4"/>
  <text x="408" y="258" text-anchor="middle" fill="#92400e">Tür</text>

  <!-- PIR detection cone, turned 60° towards the door: edges at 5° and 115° from the wall normal,
       so the door-side edge runs into the wall -->
  <path d="M 151 256 L 183.7 629.6 A 375 375 0 0 0 490.8 97.4 Z" clip-path="url(#room)"
        fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-dasharray="6 4"/>
  <text x="300" y="470" text-anchor="middle" fill="#b91c1c">Erfassungsbereich</text>
  <text x="300" y="488" text-anchor="middle" fill="#b91c1c">PIR (ca. 110°, bis 7 m)</text>
  <text x="440" y="300" text-anchor="middle" fill="#b91c1c">deckt den Eingang ab</text>

  <!-- tilt angle: wall normal vs. sensor axis -->
  <path d="M 151 256 L 151 330" stroke="#64748b" stroke-dasharray="3 3"/>
  <path d="M 151 256 L 218.5 295" stroke="#64748b"/>
  <path d="M 151 301 A 45 45 0 0 0 190 278.5" fill="none" stroke="#64748b"/>
  <text x="163" y="322" font-size="12" fill="#475569">60°</text>

  <!-- control unit outside -->
  <rect x="200" y="172" width="70" height="18" fill="#f4b400" stroke="#92400e"/>
  <text x="235" y="124" text-anchor="middle" font-weight="bold">Bedienteil</text>
  <text x="235" y="143" text-anchor="middle" fill="#334155">Keypad · Display · RFID</text>
  <text x="235" y="161" text-anchor="middle" fill="#334155">Buzzer · Arduino</text>

  <!-- cable -->
  <path d="M 225 190 L 225 208 L 137 208 L 137 232" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="400" y="118" fill="#15803d">3-adriges Kabel (5V, GND, OUT)</text>
  <text x="400" y="136" fill="#15803d">durch die Wand oder außen herum</text>
  <path d="M 396 128 Q 330 150 232 204" fill="none" stroke="#15803d" stroke-width="1"/>

  <!-- sensor unit inside, on a 60° wedge (thin end towards the door) -->
  <polygon points="125,226 150,226 150,230 128,268 125,268" fill="#94a3b8" stroke="#475569"/>
  <g transform="translate(150 230) rotate(-60)">
    <rect x="-44" y="0" width="44" height="12" fill="#f4b400" stroke="#92400e"/>
    <circle cx="-22" cy="14" r="5" fill="#ffffff" stroke="#64748b"/>
  </g>
  <text x="116" y="290" text-anchor="end" font-weight="bold">Sensorteil</text>
  <text x="116" y="308" text-anchor="end" fill="#334155">auf Keil,</text>
  <text x="116" y="326" text-anchor="end" fill="#334155">60° zur Tür</text>

  <!-- person outside -->
  <circle cx="235" cy="55" r="14" fill="#60a5fa"/>
  <text x="260" y="52" fill="#1d4ed8">steht vor dem Bedienteil</text>
  <text x="260" y="70" fill="#1d4ed8">→ Sensor sieht ihn NICHT (Wand dazwischen)</text>
</svg>
