<!-- front plate, drawn in plate coordinates (mm from its top left corner) -->
<g transform="matrix(1.2557 0.725 0 1.45 799.7446 87.28)">
  <rect width="90" height="176" rx="4" fill="url(#plate)"/>
  <circle cx="6.5" cy="6.5" r="2.9" fill="url(#screw)" stroke="#8A6400" stroke-width=".4"/><path d="M4.76 6.5 h3.48 M6.5 4.76 v3.48" stroke="#6B7280" stroke-width=".7"/><circle cx="83.5" cy="6.5" r="2.9" fill="url(#screw)" stroke="#8A6400" stroke-width=".4"/><path d="M81.76 6.5 h3.48 M83.5 4.76 v3.48" stroke="#6B7280" stroke-width=".7"/><circle cx="6.5" cy="169.5" r="2.9" fill="url(#screw)" stroke="#8A6400" stroke-width=".4"/><path d="M4.76 169.5 h3.48 M6.5 167.76 v3.48" stroke="#6B7280" stroke-width=".7"/><circle cx="83.5" cy="169.5" r="2.9" fill="url(#screw)" stroke="#8A6400" stroke-width=".4"/><path d="M81.76 169.5 h3.48 M83.5 167.76 v3.48" stroke="#6B7280" stroke-width=".7"/>

  <!-- OLED behind a 32 x 18 mm window, active area 29.4 x 14.7 mm = 128 x 64 px -->
  <rect x="29" y="15.7" width="32" height="18" rx=".8" fill="#05070B" stroke="#B98400" stroke-width=".5"/>
  <g transform="translate(30.3,17.35) scale(.2297)" fill="#D7ECFF">
    <!-- heart, same primitives as drawHeart(64, 30) -->
    <g class="ph-heart"><g class="beat"><circle cx="56" cy="24" r="9.5"/><circle cx="72" cy="24" r="9.5"/><polygon points="48,29 80,29 64,48"/></g></g>
    <!-- masked PIN entry -->
    <g class="ph-entry"><text x="64" y="44" font-size="30" font-weight="700" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">****</text></g>
    <!-- skull, same primitives as drawSkull(64, 34) -->
    <g class="ph-armed">
      <rect x="45" y="12" width="38" height="32" rx="12"/><rect x="53" y="38" width="22" height="13" rx="4"/>
      <circle cx="55" cy="27" r="6.5" fill="#05070B"/><circle cx="73" cy="27" r="6.5" fill="#05070B"/>
      <polygon points="64,33 61,38 67,38" fill="#05070B"/>
      <g fill="#05070B"><rect x="53" y="39" width="22" height="1"/><rect x="57" y="40" width="1" height="11"/><rect x="62" y="40" width="1" height="11"/><rect x="67" y="40" width="1" height="11"/><rect x="72" y="40" width="1" height="11"/></g>
    </g>
    <!-- alarm: the whole screen flips every 250 ms -->
    <!-- alarm: the whole screen flips every 250 ms, like drawSkull(fg, bg) -->
    <g class="ph-alarm">
      <g class="flash">
        <rect x="-4" y="-4" width="136" height="72" fill="#D7ECFF"/>
        <use href="#alarmSkull" color="#05070B" fill="#D7ECFF"/>
      </g>
      <g class="flash" style="animation-delay:-.25s"><use href="#alarmSkull" color="#D7ECFF" fill="#05070B"/></g>
    </g>
    </g>

  <!-- buzzer behind 7 sound holes -->
  <g fill="#3A2A00"><circle cx="75.1" cy="24.7" r="1"/><circle cx="78.60" cy="24.70" r="1"/><circle cx="76.85" cy="27.73" r="1"/><circle cx="73.35" cy="27.73" r="1"/><circle cx="71.60" cy="24.70" r="1"/><circle cx="73.35" cy="21.67" r="1"/><circle cx="76.85" cy="21.67" r="1"/></g>
  <g class="ph-alarm"><circle class="ring" cx="75.1" cy="24.7" r="6.5" fill="none" stroke="#FBBF24" stroke-width="1"/><circle class="ring" cx="75.1" cy="24.7" r="6.5" fill="none" stroke="#FBBF24" stroke-width="1" style="animation-delay:.4s"/><circle class="ring" cx="75.1" cy="24.7" r="6.5" fill="none" stroke="#FBBF24" stroke-width="1" style="animation-delay:.8s"/></g>

  <!-- engravings -->
  <g fill="#C48F00" font-weight="800" text-anchor="middle">
    <text transform="translate(14.9 27.6) rotate(-90)" font-size="8.2">GAS</text>
    <text x="45" y="69.3" font-size="9.5">RFID</text>
  </g>
  <rect x="20" y="49.9" width="50" height="32" rx="4" fill="none" stroke="#C48F00" stroke-width=".8"/>
  <rect class="ring" x="24" y="54" width="42" height="24" rx="5" fill="none" stroke="#7DD3FC" stroke-width="1.2"/>
  <rect class="ring" x="24" y="54" width="42" height="24" rx="5" fill="none" stroke="#7DD3FC" stroke-width="1.2" style="animation-delay:.6s"/>

  <!-- membrane keypad glued on the front, ribbon through the slot below it -->
  <rect x="33.5" y="166.9" width="23" height="4" fill="#2A1E00"/>
  <rect x="34.5" y="166.9" width="21" height="2.2" fill="#A3A8B0"/>
  <rect x="10.25" y="89.9" width="69.5" height="77" rx="3" fill="#161B25"/>
  <g font-size="8" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="14.6" y="92.2" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="30.6" y="92.2" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="46.6" y="92.2" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="62.6" y="92.2" width="12.8" height="13.8" rx="1.8" fill="#DC2626"/><rect x="14.6" y="109.4" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="30.6" y="109.4" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="46.6" y="109.4" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="62.6" y="109.4" width="12.8" height="13.8" rx="1.8" fill="#DC2626"/><rect x="14.6" y="126.6" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="30.6" y="126.6" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="46.6" y="126.6" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="62.6" y="126.6" width="12.8" height="13.8" rx="1.8" fill="#DC2626"/><rect x="14.6" y="143.8" width="12.8" height="13.8" rx="1.8" fill="#DC2626"/><rect x="30.6" y="143.8" width="12.8" height="13.8" rx="1.8" fill="#3B82F6"/><rect x="46.6" y="143.8" width="12.8" height="13.8" rx="1.8" fill="#DC2626"/><rect x="62.6" y="143.8" width="12.8" height="13.8" rx="1.8" fill="#DC2626"/>
    <text x="21" y="102.0">1</text><text x="37" y="102.0">2</text><text x="53" y="102.0">3</text><text x="69" y="102.0">A</text><text x="21" y="119.2">4</text><text x="37" y="119.2">5</text><text x="53" y="119.2">6</text><text x="69" y="119.2">B</text><text x="21" y="136.4">7</text><text x="37" y="136.4">8</text><text x="53" y="136.4">9</text><text x="69" y="136.4">C</text><text x="21" y="153.6">*</text><text x="37" y="153.6">0</text><text x="53" y="153.6">#</text><text x="69" y="153.6">D</text>
  </g>
  <!-- key presses during the PIN phase (not the real PIN) -->
  <rect class="key k1" x="46.6" y="92.2" width="12.8" height="13.8" rx="1.8" fill="#fff" opacity="0"/>
  <rect class="key k2" x="46.6" y="109.4" width="12.8" height="13.8" rx="1.8" fill="#fff" opacity="0"/>
  <rect class="key k3" x="46.6" y="126.6" width="12.8" height="13.8" rx="1.8" fill="#fff" opacity="0"/>
  <rect class="key k4" x="46.6" y="143.8" width="12.8" height="13.8" rx="1.8" fill="#fff" opacity="0"/>
</g>

<!-- RFID card held in front of the reader (outer group bobs, inner group is a plane
     parallel to the front plate, 40 mm in front of it) -->
<g class="float">
  <g transform="matrix(1.2557 0.725 0 1.45 749.5166 116.28)">
