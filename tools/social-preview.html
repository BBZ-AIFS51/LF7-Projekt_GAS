<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview</title>
<!-- Template for docs/social-preview.png, filled and captured by tools/render.mjs.
     GitHub: 1280 x 640 px (at least 640 x 320), PNG/JPG/GIF under 1 MB.
     Everything important stays 48 px away from the edges, some sites crop a bit. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block">
<style>
  :root { --ink: #F1F5F9; --muted: #A3AEC2; --accent: #7DD3FC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative; color: var(--ink);
    font-family: Inter, "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(148, 163, 184, .10) 1px, transparent 1.5px) 0 0 / 24px 24px,
      radial-gradient(ellipse 55% 75% at 76% 52%, rgba(56, 120, 200, .30), transparent 70%),
      linear-gradient(135deg, #0E131C 0%, #141B27 55%, #18202E 100%);
  }
  .copy { position: absolute; left: 72px; top: 76px; width: 640px; }
  .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }
  h1 { margin: 14px 0 0; font-size: 104px; line-height: 1; font-weight: 800; letter-spacing: -.035em; }
  .sub { margin: 22px 0 0; max-width: 560px; font-size: 31px; line-height: 1.3; color: var(--muted); font-weight: 500; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .pill { font-size: 21px; font-weight: 700; padding: 9px 20px; border-radius: 999px; }
  .p1 { background: #14532D; color: #BBF7D0; }
  .p2 { background: #1E3A8A; color: #BFDBFE; }
  .p3 { background: #713F12; color: #FDE68A; }
  .p4 { background: #7F1D1D; color: #FECACA; }
  .foot { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 22px; align-items: center; font-size: 20px; color: var(--muted); font-weight: 500; }
  .foot b { color: var(--ink); font-weight: 600; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #475569; }
  .hero { position: absolute; right: 18px; top: 0; width: 560px; height: 640px; object-fit: contain; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .45)); }
</style>
</head>
<body>
  <img id="hero" class="hero" alt="">
  <div class="copy">
    <div class="eyebrow">LF07 · Arduino Uno R3</div>
    <h1>Projekt GAS</h1>
    <p class="sub">Mini security system with keypad,<br>RFID reader and motion sensor</p>
    <div class="pills">
      <span class="pill p1">PIN + #</span>
      <span class="pill p2">RFID card</span>
      <span class="pill p3">Motion sensor</span>
      <span class="pill p4">Alarm</span>
    </div>
  </div>
  <div class="foot"><b>3D-printed case</b><span class="dot"></span><b>Live 3D model</b><span class="dot"></span>BBZ-AIFS51/LF7-Projekt_GAS</div>
</body>
</html>
