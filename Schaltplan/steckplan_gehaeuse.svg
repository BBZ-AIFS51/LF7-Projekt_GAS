<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<!-- Steckplan des Mini-Breadboards (SYB-170) im Bedienteil, von Hand gezeichnet.
     Gleiche Belegung wie im 3D-Viewer (docs/viewer/index.html, buildCase()). -->
<style>
  .t   { font-size: 13px; fill: #CBD5E1; }
  .s   { font-size: 11.5px; fill: #94A3B8; }
  .b   { font-weight: 700; fill: #E2E8F0; }
  .h   { fill: #3B3B3B; }
  .w   { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .wo  { fill: none; stroke: #0B0F17; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
  .end { stroke: #0B0F17; stroke-width: 1.5; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#18202E"/></linearGradient>
  <!-- 5 holes of one half column, x = column centre -->
  <g id="half"><rect x="-5" y="-5" width="10" height="10" rx="1.5" class="h"/><rect x="-5" y="25" width="10" height="10" rx="1.5" class="h"/><rect x="-5" y="55" width="10" height="10" rx="1.5" class="h"/><rect x="-5" y="85" width="10" height="10" rx="1.5" class="h"/><rect x="-5" y="115" width="10" height="10" rx="1.5" class="h"/></g>
</defs>

<rect width="1200" height="800" rx="28" fill="url(#bg)"/>

<text x="40" y="52" font-size="26" font-weight="800" fill="#F1F5F9">Steckplan Mini-Breadboard im Bedienteil</text>
<text x="40" y="76" class="s" style="font-size:13px">Blick von vorne ins offene Rückteil, Uno unten · Breadboard SYB-170: 17 Spalten, je 2 × 5 Löcher · nur Stromverteilung, alle Signalleitungen gehen direkt zum Uno</text>

<!-- ================= modules on the front plate (top) ================= -->
<rect x="380" y="104" width="150" height="46" rx="8" fill="#1D4E89" stroke="#3B82F6" stroke-width="1.5"/>
<text x="455" y="124" class="b" font-size="13" text-anchor="middle">OLED</text>
<text x="455" y="141" class="s" text-anchor="middle">VCC · GND</text>
<rect x="560" y="104" width="130" height="46" rx="8" fill="#161B25" stroke="#374151" stroke-width="1.5"/>
<text x="625" y="124" class="b" font-size="13" text-anchor="middle">Buzzer</text>
<text x="625" y="141" class="s" text-anchor="middle">+ · −</text>
<rect x="720" y="104" width="190" height="46" rx="8" fill="#15803D" stroke="#22C55E" stroke-width="1.5"/>
<text x="815" y="124" class="b" font-size="13" text-anchor="middle">Kabel zum Bewegungsmelder</text>
<text x="815" y="141" class="s" text-anchor="middle" fill="#D1FAE5">VCC · GND · (OUT → A2 direkt)</text>

<!-- ================= breadboard ================= -->
<rect x="300" y="200" width="540" height="372" rx="10" fill="#ECEBE6" stroke="#C9C8C2" stroke-width="2"/>
<rect x="300" y="377" width="540" height="22" fill="#D9D8D2"/>
<!-- highlighted strips: column 13 / 15 upper half, column 17 lower half -->
<rect x="675" y="227" width="30" height="146" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
<rect x="735" y="227" width="30" height="146" rx="6" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
<rect x="795" y="403" width="30" height="146" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
<g>
  <use href="#half" x="330" y="240"/><use href="#half" x="360" y="240"/><use href="#half" x="390" y="240"/><use href="#half" x="420" y="240"/><use href="#half" x="450" y="240"/><use href="#half" x="480" y="240"/><use href="#half" x="510" y="240"/><use href="#half" x="540" y="240"/><use href="#half" x="570" y="240"/><use href="#half" x="600" y="240"/><use href="#half" x="630" y="240"/><use href="#half" x="660" y="240"/><use href="#half" x="690" y="240"/><use href="#half" x="720" y="240"/><use href="#half" x="750" y="240"/><use href="#half" x="780" y="240"/><use href="#half" x="810" y="240"/>
  <use href="#half" x="330" y="416"/><use href="#half" x="360" y="416"/><use href="#half" x="390" y="416"/><use href="#half" x="420" y="416"/><use href="#half" x="450" y="416"/><use href="#half" x="480" y="416"/><use href="#half" x="510" y="416"/><use href="#half" x="540" y="416"/><use href="#half" x="570" y="416"/><use href="#half" x="600" y="416"/><use href="#half" x="630" y="416"/><use href="#half" x="660" y="416"/><use href="#half" x="690" y="416"/><use href="#half" x="720" y="416"/><use href="#half" x="750" y="416"/><use href="#half" x="780" y="416"/><use href="#half" x="810" y="416"/>
</g>
<g font-size="10" font-weight="600" fill="#8A8A86" text-anchor="middle">
  <text x="330" y="222">1</text><text x="450" y="222">5</text><text x="600" y="222">10</text><text x="690" y="222" fill="#B91C1C">13</text><text x="750" y="222" fill="#334155">15</text><text x="810" y="222">17</text>
  <text x="330" y="566">1</text><text x="450" y="566">5</text><text x="600" y="566">10</text><text x="690" y="566" fill="#B91C1C">13</text><text x="750" y="566" fill="#334155">15</text><text x="810" y="566" fill="#B45309">17</text>
</g>
<g font-size="10" font-weight="700" fill="#8A8A86"><text x="308" y="244">a</text><text x="308" y="364">e</text><text x="308" y="420">f</text><text x="308" y="540">j</text></g>

<!-- ================= battery (left) ================= -->
<rect x="110" y="262" width="110" height="300" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
<rect x="110" y="262" width="110" height="96" rx="8" fill="#B7793F"/>
<rect x="110" y="340" width="110" height="18" fill="#B7793F"/>
<rect x="124" y="226" width="82" height="36" rx="5" fill="#0B0D12" stroke="#374151"/>
<text x="165" y="470" font-size="30" font-weight="800" fill="#E5E7EB" text-anchor="middle">9V</text>
<text x="165" y="594" class="b" font-size="13" text-anchor="middle">9-V-Block mit Clip</text>
<text x="165" y="612" class="s" text-anchor="middle">liegt links neben dem Breadboard</text>

<!-- ================= Uno power header (bottom) ================= -->
<rect x="540" y="656" width="300" height="44" rx="8" fill="#12467F" stroke="#2563A8" stroke-width="2"/>
<rect x="550" y="668" width="280" height="20" rx="3" fill="#0B0F17"/>
<g fill="#E2B340"><circle cx="570" cy="678" r="4"/><circle cx="610" cy="678" r="4"/><circle cx="650" cy="678" r="4"/><circle cx="690" cy="678" r="4"/><circle cx="730" cy="678" r="4"/><circle cx="770" cy="678" r="4"/><circle cx="810" cy="678" r="4"/></g>
<g font-size="10" font-weight="700" fill="#DBEAFE" text-anchor="middle"><text x="570" y="716">IOREF</text><text x="610" y="716">RESET</text><text x="650" y="716">3V3</text><text x="690" y="716">5V</text><text x="730" y="716">GND</text><text x="770" y="716">GND</text><text x="810" y="716">VIN</text></g>
<text x="526" y="676" class="b" font-size="13" text-anchor="end">Arduino Uno</text>
<text x="526" y="694" class="s" text-anchor="end">Power-Leiste (rechts am Uno)</text>
<!-- direct wires, not via the breadboard -->
<path class="w" stroke="#FCA5A5" d="M650 678 V750" opacity=".55"/>
<path class="w" stroke="#64748B" d="M770 678 V750" opacity=".55"/>
<text x="642" y="760" class="s" text-anchor="end">3,3 V direkt zum RC522</text>
<text x="784" y="760" class="s">GND direkt zum RC522</text>

<!-- ================= wires ================= -->
<!-- outlines first, then the colours -->
<g class="wo">
  <path d="M690 240 C690 190 770 190 770 150"/><path d="M750 240 C750 196 810 196 810 150"/>
  <path d="M690 270 C640 260 600 200 600 150"/><path d="M750 270 C700 250 650 200 650 150"/>
  <path d="M690 300 C600 300 430 220 430 150"/><path d="M750 300 C640 290 490 210 490 150"/>
  <path d="M690 330 C640 350 650 640 690 678"/><path d="M750 330 C715 360 705 640 730 678"/>
  <path d="M810 536 V678"/>
  <path d="M185 226 C185 190 262 190 262 240 V395 H790 Q810 395 810 416"/>
  <path d="M145 226 C145 168 278 168 278 236 V385 H735 Q750 385 750 360"/>
</g>
<!-- modules: a = motion sensor cable, b = buzzer, c = OLED -->
<path class="w" stroke="#EF4444" d="M690 240 C690 190 770 190 770 150"/>
<path class="w" stroke="#94A3B8" d="M750 240 C750 196 810 196 810 150"/>
<path class="w" stroke="#EF4444" d="M690 270 C640 260 600 200 600 150"/>
<path class="w" stroke="#94A3B8" d="M750 270 C700 250 650 200 650 150"/>
<path class="w" stroke="#EF4444" d="M690 300 C600 300 430 220 430 150"/>
<path class="w" stroke="#94A3B8" d="M750 300 C640 290 490 210 490 150"/>
<!-- d = jumpers to the Uno -->
<path class="w" stroke="#EF4444" d="M690 330 C640 350 650 640 690 678"/>
<path class="w" stroke="#94A3B8" d="M750 330 C715 360 705 640 730 678"/>
<!-- 9 V: battery + into column 17 lower half, jumper to VIN -->
<path class="w" stroke="#F59E0B" d="M810 536 V678"/>
<!-- battery clip leads run along the middle channel -->
<path class="w" stroke="#DC2626" d="M185 226 C185 190 262 190 262 240 V395 H790 Q810 395 810 416"/>
<path class="w" stroke="#1F2937" d="M145 226 C145 168 278 168 278 236 V385 H735 Q750 385 750 360"/>
<path fill="none" stroke="#64748B" stroke-width="1.2" d="M145 226 C145 168 278 168 278 236 V385 H735 Q750 385 750 360"/>
<!-- plug ends -->
<g class="end">
  <rect x="684" y="234" width="12" height="12" fill="#EF4444"/><rect x="744" y="234" width="12" height="12" fill="#94A3B8"/>
  <rect x="684" y="264" width="12" height="12" fill="#EF4444"/><rect x="744" y="264" width="12" height="12" fill="#94A3B8"/>
  <rect x="684" y="294" width="12" height="12" fill="#EF4444"/><rect x="744" y="294" width="12" height="12" fill="#94A3B8"/>
  <rect x="684" y="324" width="12" height="12" fill="#EF4444"/><rect x="744" y="324" width="12" height="12" fill="#94A3B8"/>
  <rect x="744" y="354" width="12" height="12" fill="#1F2937" stroke="#94A3B8"/>
  <rect x="804" y="410" width="12" height="12" fill="#DC2626"/><rect x="804" y="530" width="12" height="12" fill="#F59E0B"/>
</g>
<text x="134" y="206" font-size="16" font-weight="800" fill="#94A3B8" text-anchor="end">−</text>
<text x="196" y="206" font-size="16" font-weight="800" fill="#FCA5A5">+</text>

<!-- ================= legend (right) ================= -->
<g transform="translate(870 210)">
  <text x="0" y="0" class="b" font-size="15">Belegung</text>
  <rect x="0" y="16" width="16" height="16" rx="3" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <text x="26" y="29" class="t"><tspan class="b">Spalte 13, oben: +5 V</tspan></text>
  <text x="26" y="47" class="s">Uno 5V · OLED · Buzzer + · Sensor</text>
  <rect x="0" y="62" width="16" height="16" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
  <text x="26" y="75" class="t"><tspan class="b">Spalte 15, oben: GND</tspan></text>
  <text x="26" y="93" class="s">Uno GND · OLED · Buzzer − · Sensor</text>
  <text x="26" y="109" class="s">· Batterie − (schwarz)</text>
  <rect x="0" y="124" width="16" height="16" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="26" y="137" class="t"><tspan class="b">Spalte 17, unten: +9 V</tspan></text>
  <text x="26" y="155" class="s">Batterie + (rot) · Brücke → VIN</text>

  <text x="0" y="196" class="s" style="font-size:12px">Alle 5 Löcher einer halben Spalte</text>
  <text x="0" y="212" class="s" style="font-size:12px">sind verbunden: In welchem Loch</text>
  <text x="0" y="228" class="s" style="font-size:12px">ein Kabel steckt, ist egal.</text>

  <rect x="0" y="252" width="300" height="104" rx="10" fill="#3B1D22" stroke="#7F1D1D"/>
  <text x="14" y="276" font-size="13" font-weight="800" fill="#FECACA">Achtung</text>
  <text x="14" y="296" font-size="12" fill="#FECACA">9 V nie in Spalte 13 (5 V) stecken.</text>
  <text x="14" y="314" font-size="12" fill="#FECACA">VIN hat keinen Verpolungsschutz:</text>
  <text x="14" y="332" font-size="12" fill="#FECACA">rot an +9 V, schwarz an GND.</text>
  <text x="14" y="348" font-size="11" fill="#FCA5A5">Vertauscht = Uno kaputt.</text>
</g>
<text x="1160" y="786" font-size="11" fill="#475569" text-anchor="end">Schaltplan/steckplan_gehaeuse.svg · Pins aller Signale: CLAUDE.md / Wiki Kapitel 5</text>
</svg>
